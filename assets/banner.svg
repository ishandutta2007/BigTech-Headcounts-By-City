<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    
    /* Animations */
    @keyframes pulse-wave {
      0% { transform: scale(0.98); opacity: 0.4; }
      50% { transform: scale(1.02); opacity: 0.8; }
      100% { transform: scale(0.98); opacity: 0.4; }
    }

    @keyframes float-node {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    @keyframes chart-grow {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-bg-circle { animation: pulse-wave 6s infinite ease-in-out; transform-origin: center; }
    .floating-card-1 { animation: float-node 5s infinite ease-in-out; }
    .floating-card-2 { animation: float-node 7s infinite ease-in-out 1s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Glowing Background Orbs (Behind Content) -->
  <circle class="animated-bg-circle" cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle class="animated-bg-circle" cx="1050" cy="240" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Background Animated Stat Micro-cards (Positioned to sides so text stays clear) -->
  <g class="floating-card-1" transform="translate(850, 45)">
    <rect width="280" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600">USA Tech Hubs Total</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="26" fill="#38bdf8" font-weight="700">250,900+ R&amp;D</text>
  </g>

  <g class="floating-card-2" transform="translate(850, 165)">
    <rect width="280" height="90" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" font-weight="600">India Tech Hubs Total</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="26" fill="#c084fc" font-weight="700">51,600+ R&amp;D</text>
  </g>

  <!-- Foreground Title and Subtitle Block (Guaranteed Clear & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Pill Tag -->
    <rect x="0" y="45" width="230" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="15" y="65" class="badge-text">📊 DATA &amp; INSIGHTS 2026</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title">BigTech Headcounts By City</text>

    <!-- Gradient Line Divider -->
    <rect x="0" y="155" width="480" height="4" rx="2" fill="url(#accent-grad)" />

    <!-- Subtitle / Meta Description -->
    <text x="0" y="200" class="subtitle">Estimated Core Engineering &amp; R&amp;D Workforce Statistics</text>
    <text x="0" y="230" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">
      Comparing Google, Amazon, Microsoft, Apple, Meta &amp; Adobe across USA &amp; India hubs.
    </text>
  </g>
</svg>
